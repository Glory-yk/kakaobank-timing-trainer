name: Build Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: kakaobank-timing-trainer-windows.exe
            build_cmd: pyinstaller --noconfirm --onefile --name kakaobank-timing-trainer --add-data "index.html;." server.py
            output_path: dist/kakaobank-timing-trainer.exe
          - os: macos-latest
            artifact_name: kakaobank-timing-trainer-mac
            build_cmd: pyinstaller --noconfirm --onefile --name kakaobank-timing-trainer-mac --add-data "index.html:." server.py
            output_path: dist/kakaobank-timing-trainer-mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*-mac
          draft: false
          prerelease: false
          generate_release_notes: true
